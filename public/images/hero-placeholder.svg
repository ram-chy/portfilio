<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#grad2)" />
  
  <!-- Main circle -->
  <circle cx="200" cy="200" r="150" fill="url(#grad1)" />
  
  <!-- Code brackets -->
  <text x="200" y="180" font-family="monospace" font-size="80" font-weight="bold" fill="white" text-anchor="middle"></></text>
  
  <!-- Subtitle -->
  <text x="200" y="240" font-family="system-ui" font-size="20" fill="white" text-anchor="middle" opacity="0.9">Developer</text>
</svg>